name: Helm Lint

on:
    push:
        branches:
            - main
        paths:
            - ".github/workflows/helm-lint.yml"
            - "Makefile"
            - "scripts/ci/helm-lint.sh"
            - "charts/**"
            - "!README.md"
    pull_request:
        paths:
            - ".github/workflows/helm-lint.yml"
            - "Makefile"
            - "scripts/ci/helm-lint.sh"
            - "charts/**"
            - "!README.md"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    helm-lint:
        name: Helm Lint
        runs-on: ubuntu-latest
        container:
            image: ${{ vars.HELM_TOOLCHAIN_IMAGE }}
        steps:
            # actions/checkout v6.0.2
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Helm lint
              run: ./scripts/ci/helm-lint.sh
